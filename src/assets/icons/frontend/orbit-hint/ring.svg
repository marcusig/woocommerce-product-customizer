<!-- Orbit hint: the rotation ring the pointer rides.
     Two open arcs rather than a closed ellipse — each one runs into an
     arrowhead so the head caps the stroke instead of sitting on top of it,
     which at this size is the difference between a ring and a smudge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 22" fill="none" stroke="currentColor" stroke-width="1.6">
	<path d="M4.3 12.3a17 7.5 0 0 0 33.4 0" opacity=".6"/>
	<path d="M37.7 9.7a17 7.5 0 0 0-33.4 0" opacity=".6"/>
	<path d="M4 16 0.8 9.6h6.4z" fill="currentColor" stroke="none"/>
	<path d="M38 6 41.2 12.4h-6.4z" fill="currentColor" stroke="none"/>
</svg>
